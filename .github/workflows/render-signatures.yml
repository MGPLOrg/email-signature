# When someone's details are saved to people/ (the generator opens GitHub with the file filled in),
# draw their signature pictures (see .github/scripts/render_signatures.py). Uses the workflow's own token.
name: Draw signatures

on:
  push:
    branches: [main]
    paths:
      - 'people/**'
      - 'assets/photos/*'
      - '.github/scripts/render_signatures.py'
      - '.github/workflows/render-signatures.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: render-signatures
  cancel-in-progress: false

jobs:
  draw:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow==11.0.0
      - run: python .github/scripts/render_signatures.py
      - name: Commit the signature pictures
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A assets/email/people
          if git diff --cached --quiet; then echo "nothing new to draw"; exit 0; fi
          git commit -m "Draw email signature pictures"
          git pull --rebase origin main
          git push
