# When a photo is uploaded to assets/photos/, make its email-ready version in assets/photos/email/
# (see .github/scripts/prepare_photos.py). Uses the workflow's own token; nobody needs one.
name: Prepare signature photos

on:
  push:
    branches: [main]
    paths:
      - 'assets/photos/*'
      - '.github/scripts/prepare_photos.py'
      - '.github/workflows/prepare-photos.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: prepare-photos
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow==11.0.0
      - run: python .github/scripts/prepare_photos.py
      - name: Commit the email-ready photos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A assets/photos/email
          if git diff --cached --quiet; then echo "nothing to update"; exit 0; fi
          git commit -m "Prepare email versions of signature photos"
          git pull --rebase origin main
          git push
